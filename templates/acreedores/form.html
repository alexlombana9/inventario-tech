{% extends "base.html" %}
{% block title %}{{ accion }} Acreedor{% endblock %}
{% block page_title %}Finanzas &rsaquo; Acreedores &rsaquo; {{ accion }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1>
    <i class="bi bi-{% if accion == 'Nuevo' %}plus-circle{% else %}pencil-square{% endif %} me-2 text-primary"></i>
    {{ accion }} Acreedor
  </h1>
  <a href="/acreedores" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Volver
  </a>
</div>

<div class="form-card">
  <form method="post"
        action="{% if acreedor %}/acreedores/{{ acreedor.id }}/editar{% else %}/acreedores/nuevo{% endif %}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombre <span class="text-danger">*</span></label>
        <input type="text" name="nombre" class="form-control"
               value="{{ acreedor.nombre if acreedor else '' }}"
               placeholder="Ej: Distribuidora XYZ, Banco Nacional..." required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Tipo</label>
        <select name="tipo" class="form-select">
          {% for t in tipos_acreedor %}
          <option value="{{ t }}"
            {% if acreedor and acreedor.tipo == t %}selected
            {% elif not acreedor and t == 'OTRO' %}selected{% endif %}>
            {{ t | capitalize }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Documento / NIT</label>
        <input type="text" name="documento" class="form-control"
               value="{{ acreedor.documento if acreedor else '' }}"
               placeholder="Ej: 900123456-1">
      </div>
      <div class="col-md-4">
        <label class="form-label">Telefono</label>
        <input type="text" name="telefono" class="form-control"
               value="{{ acreedor.telefono if acreedor else '' }}"
               placeholder="Ej: 3001234567">
      </div>
      <div class="col-md-4">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control"
               value="{{ acreedor.email if acreedor else '' }}"
               placeholder="Ej: contacto@empresa.com">
      </div>
      <div class="col-md-4">
        <label class="form-label">Direccion</label>
        <input type="text" name="direccion" class="form-control"
               value="{{ acreedor.direccion if acreedor else '' }}"
               placeholder="Ej: Calle 123 #45-67">
      </div>
      <div class="col-12">
        <label class="form-label">Notas</label>
        <textarea name="notas" class="form-control" rows="2"
                  placeholder="Observaciones, condiciones de pago, etc.">{{ acreedor.notas if acreedor else '' }}</textarea>
      </div>
    </div>

    <hr class="my-4">
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary px-4">
        <i class="bi bi-check-lg me-1"></i>{{ 'Actualizar' if acreedor else 'Crear Acreedor' }}
      </button>
      <a href="/acreedores" class="btn btn-outline-secondary px-4">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
