<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — TechStock</title>
  <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-brand .icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #0d6efd, #4fc3f7);
      border-radius: 16px;
      display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(13,110,253,0.3);
    }
    .login-brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #212529;
      margin: 0 0 4px;
    }
    .login-brand p {
      font-size: 0.85rem;
      color: #6c757d;
      margin: 0;
    }
    .form-label {
      font-weight: 600;
      font-size: 0.82rem;
      color: #495057;
    }
    .form-control {
      border-radius: 10px;
      border: 1.5px solid #dee2e6;
      padding: 10px 14px;
      font-size: 0.9rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13,110,253,0.12);
    }
    .input-group-text {
      background: #f8f9fa;
      border: 1.5px solid #dee2e6;
      border-radius: 10px 0 0 10px;
      color: #6c757d;
    }
    .input-group .form-control {
      border-radius: 0 10px 10px 0;
    }
    .btn-login {
      width: 100%;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d6efd, #0b5ed7);
      border: none;
      color: #fff;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(13,110,253,0.25);
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(13,110,253,0.35);
      background: linear-gradient(135deg, #0b5ed7, #0a58ca);
      color: #fff;
    }
    .alert {
      border-radius: 10px;
      border: none;
      font-size: 0.85rem;
      padding: 10px 14px;
    }
    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
    }
    @media (max-width: 480px) {
      .login-card { padding: 28px 24px; }
      .login-brand .icon { width: 52px; height: 52px; font-size: 1.4rem; }
      .login-brand h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="icon"><i class="bi bi-cpu-fill"></i></div>
        <h1>TechStock</h1>
        <p>Sistema de Inventario</p>
      </div>

      {% if error %}
      <div class="alert alert-danger d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-exclamation-triangle-fill"></i>
        {{ error }}
      </div>
      {% endif %}

      {% if agregar == '1' %}
      <div class="alert alert-info d-flex align-items-center gap-2 mb-3" style="font-size:0.82rem;">
        <i class="bi bi-info-circle-fill"></i>
        Ingresa las credenciales de la otra cuenta. Tu sesion actual se mantendra guardada.
      </div>
      {% endif %}

      <form method="POST" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <input type="hidden" name="agregar" value="{{ agregar }}">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="Nombre de usuario"
                   required autofocus autocomplete="username">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Contrasena</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="Tu contrasena"
                   required autocomplete="current-password">
          </div>
        </div>
        <button type="submit" class="btn btn-login">
          <i class="bi bi-box-arrow-in-right me-1"></i>
          {% if agregar == '1' %}Agregar Cuenta{% else %}Iniciar Sesion{% endif %}
        </button>
      </form>
      {% if agregar == '1' %}
      <div class="text-center mt-3">
        <a href="/" class="text-decoration-none" style="font-size:0.82rem;">
          <i class="bi bi-arrow-left me-1"></i>Volver sin agregar cuenta
        </a>
      </div>
      {% endif %}
    </div>
    <p class="footer-text">TechStock v2.0 &mdash; Gestión de Inventario</p>
  </div>
</body>
</html>
