{% extends "base.html" %}
{% block title %}{{ accion }} Cliente{% endblock %}
{% block page_title %}{{ accion }} Cliente{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-person-{% if cliente %}gear{% else %}plus{% endif %} me-2"></i>{{ accion }} Cliente</h1>
  <a href="/clientes" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>

<div class="form-card">
  <form method="POST" action="/clientes{% if cliente %}/{{ cliente.id }}/editar{% else %}/nuevo{% endif %}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Nombre <span class="text-danger">*</span></label>
        <input type="text" name="nombre" class="form-control" required value="{{ cliente.nombre if cliente else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Tipo Documento</label>
        <select name="tipo_documento" class="form-select">
          {% for t in tipos_documento %}
          <option value="{{ t }}" {% if cliente and cliente.tipo_documento == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">N° Documento</label>
        <input type="text" name="documento" class="form-control" value="{{ cliente.documento if cliente else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono if cliente else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ cliente.email if cliente else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Dirección</label>
        <input type="text" name="direccion" class="form-control" value="{{ cliente.direccion if cliente else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Notas</label>
        <textarea name="notas" class="form-control" rows="2">{{ cliente.notas if cliente else '' }}</textarea>
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>{{ "Guardar" if cliente else "Crear Cliente" }}</button>
      <a href="/clientes" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
