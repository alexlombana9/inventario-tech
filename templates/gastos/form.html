{% extends "base.html" %}
{% block title %}{{ 'Editar' if gasto else 'Nuevo' }} Gasto{% endblock %}
{% block page_title %}{{ 'Editar' if gasto else 'Nuevo' }} Gasto{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-wallet2 me-2"></i>{{ 'Editar' if gasto else 'Nuevo' }} Gasto</h1>
  <a href="/gastos" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>

<div class="table-card p-4">
  <form method="POST" action="{{ '/gastos/' ~ gasto.id ~ '/editar' if gasto else '/gastos/nuevo' }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Concepto <span class="text-danger">*</span></label>
        <input type="text" name="concepto" class="form-control" required
               value="{{ gasto.concepto if gasto else '' }}" placeholder="Descripcion del gasto">
      </div>
      <div class="col-md-4">
        <label class="form-label">Monto <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text">$</span>
          <input type="number" name="monto" class="form-control" required min="1" step="100"
                 value="{{ gasto.monto | int if gasto else '' }}" placeholder="0">
        </div>
      </div>

      <div class="col-md-4">
        <label class="form-label">Tipo</label>
        <select name="tipo" class="form-select">
          {% for t in tipos_gasto %}
          <option value="{{ t }}" {% if gasto and gasto.tipo == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Categoria</label>
        <select name="categoria_gasto" class="form-select">
          <option value="">Sin categoria</option>
          {% for c in categorias_gasto %}
          <option value="{{ c }}" {% if gasto and gasto.categoria_gasto == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Fecha</label>
        <input type="date" name="fecha" class="form-control"
               value="{{ gasto.fecha.strftime('%Y-%m-%d') if gasto else '' }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">Metodo de Pago</label>
        <select name="metodo_pago" class="form-select">
          {% for m in metodos_pago %}
          <option value="{{ m }}" {% if gasto and gasto.metodo_pago == m %}selected{% endif %}>{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Comprobante</label>
        <input type="text" name="comprobante" class="form-control"
               value="{{ gasto.comprobante if gasto else '' }}" placeholder="N° recibo o factura">
      </div>
      <div class="col-md-4">
        <!-- spacer -->
      </div>

      <div class="col-12">
        <label class="form-label">Notas</label>
        <textarea name="notas" class="form-control" rows="2" placeholder="Observaciones...">{{ gasto.notas if gasto else '' }}</textarea>
      </div>
    </div>

    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg me-1"></i>{{ 'Actualizar' if gasto else 'Registrar' }} Gasto
      </button>
      <a href="/gastos" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
