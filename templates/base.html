<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TechStock{% endblock %} - Sistema de Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <i class="bi bi-cpu-fill me-2"></i>
    <span>TechStock</span>
  </div>

  <ul class="sidebar-nav">
    <li class="nav-item">
      <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
    </li>

    <li class="nav-section">INVENTARIO</li>

    <li class="nav-item">
      <a href="/productos" class="nav-link {% if '/productos' in request.url.path %}active{% endif %}">
        <i class="bi bi-box-seam"></i>
        <span>Productos</span>
      </a>
    </li>
    <li class="nav-item">
      <a href="/inventario" class="nav-link {% if '/inventario' in request.url.path %}active{% endif %}">
        <i class="bi bi-arrow-left-right"></i>
        <span>Movimientos</span>
      </a>
    </li>
    <li class="nav-item">
      <a href="/categorias" class="nav-link {% if '/categorias' in request.url.path %}active{% endif %}">
        <i class="bi bi-tags"></i>
        <span>Categorías</span>
      </a>
    </li>

    <li class="nav-section">COMPRAS</li>

    <li class="nav-item">
      <a href="/proveedores" class="nav-link {% if '/proveedores' in request.url.path %}active{% endif %}">
        <i class="bi bi-truck"></i>
        <span>Proveedores</span>
      </a>
    </li>
    <li class="nav-item">
      <a href="/inventario/entrada" class="nav-link {% if request.url.path == '/inventario/entrada' %}active{% endif %}">
        <i class="bi bi-box-arrow-in-down"></i>
        <span>Registrar Entrada</span>
      </a>
    </li>

    <li class="nav-section">ANÁLISIS</li>

    <li class="nav-item">
      <a href="/reportes/stock" class="nav-link {% if '/reportes/stock' in request.url.path %}active{% endif %}">
        <i class="bi bi-bar-chart-line"></i>
        <span>Reporte de Stock</span>
      </a>
    </li>
    <li class="nav-item">
      <a href="/reportes/movimientos" class="nav-link {% if '/reportes/movimientos' in request.url.path %}active{% endif %}">
        <i class="bi bi-graph-up"></i>
        <span>Reporte Movimientos</span>
      </a>
    </li>
  </ul>

  <div class="sidebar-footer">
    <small><i class="bi bi-circle-fill text-success me-1" style="font-size:8px"></i>Sistema activo</small>
  </div>
</nav>

<!-- Main content -->
<div class="main-content" id="mainContent">
  <!-- Topbar -->
  <div class="topbar">
    <button class="btn btn-sm btn-outline-secondary" id="sidebarToggle">
      <i class="bi bi-list fs-5"></i>
    </button>
    <div class="topbar-title">{% block page_title %}{% endblock %}</div>
    <div class="topbar-actions">
      <a href="/inventario/entrada" class="btn btn-primary btn-sm me-2">
        <i class="bi bi-plus-lg me-1"></i>Entrada
      </a>
      <a href="/inventario/salida" class="btn btn-outline-danger btn-sm">
        <i class="bi bi-dash-lg me-1"></i>Salida
      </a>
    </div>
  </div>

  <!-- Content area -->
  <div class="content-area">
    {% block content %}{% endblock %}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
