version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: techstock
      POSTGRES_PASSWORD: techstock_pass
      POSTGRES_DB: techstock
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techstock"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://techstock:techstock_pass@db:5432/techstock
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
